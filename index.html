<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Wumuchong</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    /* Message d'erreur visible pour l'utilisateur */
    .error {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4444;
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      display: none;
      z-index: 1000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
      "GLTFLoader": "https://unpkg.com/three@0.155.0/examples/jsm/loaders/GLTFLoader.js",
      "OrbitControls": "https://unpkg.com/three@0.155.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <div class="error" id="errorMsg">❌ Échec du chargement du modèle 3D</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'GLTFLoader';
    import { OrbitControls } from 'OrbitControls';

    // === ÉLÉMENTS UTILES ===
    const errorMsg = document.getElementById('errorMsg');
    const modelPath = 'model/wumuchongg.glb'; // Confirmé : double g

    // === SCÈNE ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // === CAMERA ===
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    // On utilise directement startPosition (évite la redondance)
    const startPosition = new THREE.Vector3(100, 100, 70);
    const targetPosition = new THREE.Vector3(-5, 0, 5);
    camera.position.copy(startPosition);
    camera.lookAt(0, 0, 0);

    // === RENDERER ===
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      powerPreference: "high-performance" // Meilleur pour Netlify
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // === CONTROLS ===
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05; // Plus fluide

    // === LUMIÈRES ===
    const light = new THREE.DirectionalLight(0xffffff, 3.5);
    light.position.set(50, 40, 30);
    light.castShadow = true;
    light.shadow.mapSize.set(2048, 2048);
    light.shadow.camera.left = -50;
    light.shadow.camera.right = 50;
    light.shadow.camera.top = 50;
    light.shadow.camera.bottom = -50;
    light.shadow.camera.near = 1;
    light.shadow.camera.far = 100;
    scene.add(light);

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    // === SOL (pour voir les ombres + confirmer que Three.js fonctionne) ===
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0xe0e0e0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -10;
    ground.receiveShadow = true;
    scene.add(ground);

    // === CHARGEMENT DU MODÈLE GLB ===
    const loader = new GLTFLoader();
    loader.load(
      modelPath,
      (gltf) => {
        console.log('✅ Modèle chargé :', gltf);
        const model = gltf.scene;
        model.scale.set(5, 5, 5);
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        scene.add(model);
      },
      // Progression du chargement (pour debug)
      (xhr) => {
        const percent = Math.round((xhr.loaded / xhr.total) * 100);
        console.log(`📥 Chargement : ${percent}%`);
      },
      // Gestion détaillée des erreurs
      (error) => {
        console.error('❌ Erreur complète :', error);
        console.error('👉 Informations utiles :');
        console.error('   - Chemin demandé :', modelPath);
        console.error('   - URL complète :', window.location.origin + '/' + modelPath);
        console.error('   - Vérifiez le fichier sur Netlify : https://app.netlify.com/sites/wumuchong/deploys');
        errorMsg.style.display = 'block';
        // Cacher le message après 10s
        setTimeout(() => errorMsg.style.display = 'none', 10000);
      }
    );

    // === ANIMATION DE LA CAMÉRA ===
    let progress = 0;
    const speed = 0.008;
    let animationDone = false;

    function animate() {
      requestAnimationFrame(animate);

      if (!animationDone && progress < 1) {
        progress += speed;
        camera.position.lerpVectors(startPosition, targetPosition, progress);
        camera.lookAt(0, 0, 0); // Garder la caméra orientée vers le centre
        if (progress >= 1) animationDone = true; // Arrêter l'animation
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // === ADAPTATION À LA FENÊTRE ===
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
