<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Visualiseur 3D Wumuchong</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; font-family: Arial, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
        .status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            background: rgba(0,0,0,0.7);
            z-index: 100;
        }
        .error { background: rgba(255, 68, 68, 0.9); }
        .loading { background: rgba(68, 150, 255, 0.9); }
    </style>
    <!-- Import de Three.js via importmap (standard) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="status loading" id="status">Chargement du modèle 3D...</div>

    <script type="module">
        // Import des modules Three.js nécessaires
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // === CONFIGURATION BASIQUE ===
        const MODEL_PATH = 'model/wumuchongg.glb'; // Chemin vers ton fichier
        const MODEL_SCALE = 5; // Ajuste la taille si besoin

        // === INITIALISATION DE LA SCÈNE 3D ===
        // 1. Scène
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);

        // 2. Caméra (vue perspective)
        const camera = new THREE.PerspectiveCamera(
            75, // Angle de vue
            window.innerWidth / window.innerHeight, // Ratio écran
            0.1, // Distance minimale de rendu
            1000 // Distance maximale de rendu
        );
        camera.position.z = 15; // Position initiale de la caméra

        // 3. Renderer (affichage)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Contrôles (rotation/zoom avec la souris)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Mouvements fluides
        controls.dampingFactor = 0.05;

        // === LUMIÈRES (essentielles pour voir le modèle) ===
        // Lumière ambiante (éclairage général)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // Lumière directionnelle (simule le soleil)
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // === CHARGEMENT DU MODÈLE GLB ===
        const loader = new GLTFLoader();
        const statusElement = document.getElementById('status');

        loader.load(
            // Chemin du fichier
            MODEL_PATH,

            // Succès : modèle chargé
            (gltf) => {
                const model = gltf.scene;
                
                // Ajuster la taille du modèle
                model.scale.set(MODEL_SCALE, MODEL_SCALE, MODEL_SCALE);
                
                // Centrer le modèle (optionnel mais pratique)
                model.position.set(0, 0, 0);
                
                // Ajouter le modèle à la scène
                scene.add(model);

                // Mise à jour du statut
                statusElement.textContent = "Modèle chargé ✅";
                setTimeout(() => statusElement.style.display = 'none', 3000);

                console.log("Modèle 3D chargé avec succès !");
            },

            // Progression du chargement (optionnel)
            (xhr) => {
                const pourcentage = Math.round((xhr.loaded / xhr.total) * 100);
                statusElement.textContent = `Chargement : ${pourcentage}%`;
            },

            // Erreur de chargement
            (error) => {
                statusElement.className = "status error";
                statusElement.textContent = "Erreur de chargement ❌";
                console.error("ERREUR - Impossible de charger le modèle :", error);
                console.error("Vérifiez :");
                console.error("1. Chemin du fichier :", MODEL_PATH);
                console.error("2. Fichier wumuchongg.glb existe dans le dossier 'model/'");
                console.error("3. Aucune faute de frappe dans le nom du fichier");
            }
        );

        // === ANIMATION (boucle de rendu) ===
        function animate() {
            requestAnimationFrame(animate);
            
            // Mise à jour des contrôles (pour le damping)
            controls.update();
            
            // Rendu de la scène
            renderer.render(scene, camera);
        }

        // === ADAPTATION À LA TAILLE DE LA FENÊTRE ===
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Démarrer l'animation
        animate();
    </script>
</body>
</html>
